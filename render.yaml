services:
  - type: web
    name: ai-placement-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: live
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: APP_ORIGIN
        sync: false
